services:
  # ─── INFRASTRUCTURE : BASE DE DONNÉES MONGODB ──────────────────────────────
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ─── INFRASTRUCTURE : BROKER DE MESSAGES RABBITMQ ──────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # Protocole AMQP
      - "15672:15672"   # Console d'administration Web
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # ─── 1. DISCOVERY SERVICE (EUREKA) ─────────────────────────────────────────
  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    restart: unless-stopped
    ports:
      - "8761:8761"

  # ─── 2. API GATEWAY ────────────────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8088:8088"
    depends_on:
      - discovery-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true

  # ─── 3. AUTH SERVICE ───────────────────────────────────────────────────────
  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      - discovery-service
      - mongodb
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/auth_db

  # ─── 4. PRODUCT SERVICE ────────────────────────────────────────────────────
  product-service:
    build: ./product-service
    container_name: product-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      - discovery-service
      - mongodb
      - rabbitmq
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/product_db
      - SPRING_RABBITMQ_HOST=rabbitmq

  # ─── 5. CART SERVICE ───────────────────────────────────────────────────────
  cart-service:
    build: ./cart-service
    container_name: cart-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      - discovery-service
      - mongodb
      - rabbitmq
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/cart_db
      - SPRING_RABBITMQ_HOST=rabbitmq

  # ─── 6. ORDER SERVICE ──────────────────────────────────────────────────────
  order-service:
    build: ./order-service
    container_name: order-service
    restart: unless-stopped
    ports:
      - "8089:8089"
    depends_on:
      - discovery-service
      - mongodb
      - rabbitmq
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/order_db
      - SPRING_RABBITMQ_HOST=rabbitmq

volumes:
  mongo_data:
  rabbitmq_data:
