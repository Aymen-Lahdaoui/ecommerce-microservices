server.port=8089

spring.application.name=order-service

spring.data.mongodb.uri=mongodb://localhost:27017/order_db

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ─── CONFIGURATION RESILIENCE4J ──────────────────────────────────────────────
# Circuit Breaker pour cartService
resilience4j.circuitbreaker.instances.cartService.sliding-window-size=5
resilience4j.circuitbreaker.instances.cartService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.cartService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.cartService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.cartService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cartService.automatic-transition-from-open-to-half-open-enabled=true

# Retry pour cartService
resilience4j.retry.instances.cartService.max-attempts=3
resilience4j.retry.instances.cartService.wait-duration=500ms
resilience4j.retry.instances.cartService.enable-exponential-backoff=true
resilience4j.retry.instances.cartService.exponential-backoff-multiplier=2
