# 1. Nom du service (tel qu'il apparaîtra sur ton serveur d'enregistrement Eureka)
spring.application.name=auth-service

# 2. Port sur lequel ce microservice va s'exécuter
server.port=8082

# 3. Adresse du serveur Eureka pour que l'auth-service s'y enregistre et soit découvrable
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# 4. Configuration de MongoDB (Remplace H2 et PostgreSQL)
spring.data.mongodb.uri=mongodb://localhost:27017/auth_db

# 5. Clé secrète JWT : DOIT être strictement identique à celle configurée dans ton API Gateway
# pour que l'API Gateway puisse valider les tokens générés par ce service.
jwt.secret=MaCleSecreteSuperSecuriseeEtAssezLonguePourHS512DansMonApplicationEcommerceDeTest