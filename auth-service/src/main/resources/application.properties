# 1. Nom du service (tel qu'il apparaîtra sur ton serveur d'enregistrement Eureka)
spring.application.name=auth-service

# 2. Port sur lequel ce microservice va s'exécuter (différent de la Gateway 8088 et du Product Service 8081)
server.port=8082

# 3. Adresse du serveur Eureka pour que l'auth-service s'y enregistre et soit découvrable
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# 4. Configuration de la base de données H2 (en mémoire)
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# 5. Configuration de Hibernate (JPA) pour créer/mettre à jour automatiquement les tables en base
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 6. Activation de la console Web H2 pour visualiser les données (accessible sur http://localhost:8082/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 7. Clé secrète JWT : DOIT être strictement identique à celle configurée dans ton API Gateway 
# pour que l'API Gateway puisse valider les tokens générés par ce service.
jwt.secret=MaCleSecreteSuperSecuriseeEtAssezLonguePourHS512DansMonApplicationEcommerceDeTest