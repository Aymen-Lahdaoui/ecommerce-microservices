spring.application.name=api-gateway
server.port=8088

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Clé secrète JWT (vérifie qu'elle est 100% identique à celle du auth-service)
jwt.secret=MaCleSecreteSuperSecuriseeEtAssezLonguePourHS512DansMonApplicationEcommerceDeTest

# 1. Route pour l'authentification (publique, sans filtre de sécurité)
spring.cloud.gateway.routes[0].id=auth-service-route
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# 2. Rediriger /api/products/** vers le product-service avec le filtre JWT
spring.cloud.gateway.routes[1].id=product-service-route
spring.cloud.gateway.routes[1].uri=lb://product-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthenticationFilter