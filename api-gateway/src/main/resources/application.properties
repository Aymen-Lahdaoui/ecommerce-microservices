spring.application.name=api-gateway
server.port=8088

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

jwt.secret=MaCleSecreteSuperSecuriseeEtAssezLonguePourHS512DansMonApplicationEcommerceDeTest

# Rediriger /api/products/** vers le product-service avec le filtre JWT
spring.cloud.gateway.routes[0].id=product-service-route
spring.cloud.gateway.routes[0].uri=lb://product-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/products/**
spring.cloud.gateway.routes[0].filters[0]=JwtAuthenticationFilter